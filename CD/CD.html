<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescentia Digital</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        /* Section Styling */
        section {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #2c3e50;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* Services List */
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            background: #1abc9c;
            color: white;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
        }
